services:
  postgres:
    image: postgres:16-alpine
    container_name: pmo-board-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo_board}
      POSTGRES_USER: ${POSTGRES_USER:-pmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pmo_board_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pmo-board-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pmo:pmo@postgres:5432/pmo_board?schema=public}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      PORT: ${PORT:-3333}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATA_DRIVER: ${DATA_DRIVER:-prisma}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-123456}
      BOARD_MCP_DEFAULT_USER_ID: ${BOARD_MCP_DEFAULT_USER_ID:-}
      BOARD_MCP_DEFAULT_USER_EMAIL: ${BOARD_MCP_DEFAULT_USER_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3333"

  mcp-board:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pmo-board-mcp
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "npx prisma db push --schema apps/api/prisma/schema.prisma && npm run prisma:seed -w @pmo-board/api && npm run mcp -w @pmo-board/api -- --transport streamable-http --host 0.0.0.0 --port 8011 --path /mcp"
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pmo:pmo@postgres:5432/pmo_board?schema=public}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      DATA_DRIVER: ${DATA_DRIVER:-prisma}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-123456}
      BOARD_MCP_DEFAULT_USER_ID: ${BOARD_MCP_DEFAULT_USER_ID:-}
      BOARD_MCP_DEFAULT_USER_EMAIL: ${BOARD_MCP_DEFAULT_USER_EMAIL:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8011
      MCP_PATH: /mcp
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8011"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: pmo-board-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pmo_board_pgdata:
