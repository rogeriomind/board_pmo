name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"

          PORT="${VPS_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          APP_ENV_B64: ${{ secrets.APP_ENV_B64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$APP_ENV_B64"

          PORT="${VPS_SSH_PORT:-22}"
          DEPLOY_PATH="/opt/board_pmo"
          REPO_URL="git@github.com:${GITHUB_REPOSITORY}.git"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$SSH_TARGET")

          "${SSH[@]}" "set -e; mkdir -p ~/.ssh; chmod 700 ~/.ssh; ssh-keyscan -H github.com >> ~/.ssh/known_hosts; mkdir -p '$DEPLOY_PATH'; if [ ! -d '$DEPLOY_PATH/.git' ]; then if [ -z \"\$(ls -A '$DEPLOY_PATH' 2>/dev/null)\" ]; then git clone '$REPO_URL' '$DEPLOY_PATH'; else echo '$DEPLOY_PATH exists and is not empty or a git repo'; exit 1; fi; fi"
          printf '%s' "$APP_ENV_B64" | "${SSH[@]}" "base64 -d > '$DEPLOY_PATH/.env'"
          "${SSH[@]}" "set -e; cd '$DEPLOY_PATH'; git remote set-url origin '$REPO_URL'; git fetch origin main; git checkout main; git pull --ff-only origin main; docker compose up -d --build || { docker compose ps; docker compose logs --tail=160 api mcp-board db-deploy; exit 1; }; docker compose ps"
          "${SSH[@]}" "set -e; cd '$DEPLOY_PATH'; for i in \$(seq 1 30); do if docker compose exec -T web wget -qO- http://api:3333/api/health; then exit 0; fi; sleep 2; done; docker compose ps; docker compose logs --tail=120 api mcp-board db-deploy; exit 1"
